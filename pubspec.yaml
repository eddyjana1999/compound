name: compound
description: A universal compound interest calculator.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations — do not bump to ^0.20.3, version solving fails.
  intl: 0.20.2
  flutter_riverpod: ^3.0.3
  fl_chart: ^1.1.1
  shared_preferences: ^2.5.3
  google_mobile_ads: ^9.1.0
  app_tracking_transparency: ^2.0.7
  in_app_purchase: ^3.3.0
  url_launcher: ^6.3.2
  pdf: ^3.13.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# Regenerate with: dart run flutter_launcher_icons
#
# The source art is cropped full-bleed on purpose. It arrived with its own
# rounded corners and gold frame; both platforms apply their own mask, so a
# pre-rounded image gets rounded twice and leaks its background into the
# corners. Apple's guidelines say the same: supply a full square, no alpha.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  # Android crops adaptive icons to a circle, a squircle or a teardrop
  # depending on the launcher. The foreground is inset so the Earth and the
  # Moon survive the tightest of those masks.
  adaptive_icon_background: "#10B981"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
